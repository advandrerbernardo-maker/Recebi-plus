name: Gerar APK Recebi+
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Preparar ícone oficial
        run: |
          mkdir -p android/app/src/main/res/mipmap-nodpi
          curl -fLsS https://advandrerbernardo-maker.github.io/Recebi-plus/icon-512.png -o android/app/src/main/res/mipmap-nodpi/ic_launcher.png
          file android/app/src/main/res/mipmap-nodpi/ic_launcher.png
      - name: Compilar APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: RecebiPlus-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
