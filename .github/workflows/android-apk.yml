name: Gerar APK Recebi+
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Preparar ícone oficial
        run: |
          mkdir -p android/app/src/main/res/mipmap-nodpi
          curl -fLsS https://advandrerbernardo-maker.github.io/Recebi-plus/icon-512.png -o android/app/src/main/res/mipmap-nodpi/ic_launcher.png
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          from collections import deque
          p='android/app/src/main/res/mipmap-nodpi/ic_launcher.png'
          im=Image.open(p).convert('RGBA')
          w,h=im.size
          pixels=im.load()
          # Remove somente o fundo preto conectado às bordas externas.
          seen=set()
          queue=deque()
          for x in range(w):
              queue.append((x,0))
              queue.append((x,h-1))
          for y in range(h):
              queue.append((0,y))
              queue.append((w-1,y))
          while queue:
              x,y=queue.popleft()
              if not (0<=x<w and 0<=y<h) or (x,y) in seen: continue
              seen.add((x,y))
              r,g,b,a=pixels[x,y]
              if max(r,g,b)>55 or max(r,g,b)-min(r,g,b)>27: continue
              pixels[x,y]=(r,g,b,0)
              queue.extend(((x-1,y),(x+1,y),(x,y-1),(x,y+1)))
          # Preserve apenas a área do logotipo com cantos arredondados.
          bbox=im.getchannel('A').getbbox()
          if bbox:
              im=im.crop(bbox)
          im.thumbnail((512,512),Image.Resampling.LANCZOS)
          im.save(p)
          print('Ícone sem moldura externa:',im.size)
          PY
          file android/app/src/main/res/mipmap-nodpi/ic_launcher.png
      - name: Compilar APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: RecebiPlus-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
