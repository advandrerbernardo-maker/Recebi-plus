name: Recebi Plus Tests
on:
  workflow_dispatch:
  push:
    branches: [main, teste-isolado-falha-rede-20261020]
    paths: ['index.html', 'index.html', 'recebiplus-supabase/**', 'recebiplus-tests/**', '.github/workflows/recebiplus-tests.yml']
  pull_request:
    paths: ['index.html', 'recebiplus-tests/**']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test recebiplus-tests/*.node.test.mjs
